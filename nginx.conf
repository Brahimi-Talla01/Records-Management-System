# UniArchive — Frontend Nginx
# - Sert le build Vite (SPA avec fallback history)
# - Proxy /api vers le backend (même origine → cookies de session sans souci)

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sécurité de base
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Taille max des uploads (alignée sur le backend : 50 Mo)
    client_max_body_size 50m;

    # API → backend Flask
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # SPA : toutes les routes non trouvées retombent sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets fingerprintés
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
