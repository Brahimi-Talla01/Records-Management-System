# CI — backend UniArchive (P0.7 du plan 07)
#
# Quatre vérifications, toutes bloquantes :
#   1. ruff      — E9 (erreurs de syntaxe) + F (imports morts, noms inconnus) ;
#   2. pyright   — typage statique (0 erreur, comme en local) ;
#   3. pytest    — la suite complète sur SQLite ET sur postgres:16, plus le
#                  store de sessions contre redis:7 (services du plan) ;
#   4. docker    — build de l'image puis démarrage réel : l'entrypoint exécute
#                  create_all → stamp Alembic → migrations → seeds, puis
#                  gunicorn. `/health` doit répondre 200.
#
# Les versions sont épinglées (ruff 0.16.9, pyright 1.1.414, Python 3.12) :
# une montée de version se fait dans un commit dédié, pas au fil d'une PR.
#
# Local : les mêmes commandes tournent sans GitHub —
#   venv/bin/ruff check . | venv/bin/python -m pytest | npx pyright@1.1.414

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUFF_VERSION: "0.16.9"
  PYRIGHT_VERSION: "1.1.414"
  POSTGRES_USER: uniarchive
  POSTGRES_PASSWORD: uniarchive_ci_password
  POSTGRES_DB: uniarchive_ci

jobs:
  # -------------------------------------------------------------------------
  # 1. Lint
  # -------------------------------------------------------------------------
  lint:
    name: Ruff (E9 + F)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installation de ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: ruff check .
        run: ruff check .

  # -------------------------------------------------------------------------
  # 2. Typage statique
  # -------------------------------------------------------------------------
  typecheck:
    name: Pyright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # pyright résout les imports via pyrightconfig.json → venvPath "venv" :
      # le venv doit donc avoir le même emplacement qu'en local.
      - name: Environnement virtuel
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements-dev.txt

      - name: pyright
        run: npx --yes "pyright@${PYRIGHT_VERSION}"

  # -------------------------------------------------------------------------
  # 3. Tests (SQLite + PostgreSQL + Redis)
  # -------------------------------------------------------------------------
  test:
    name: Pytest (SQLite, PostgreSQL 16, Redis 7)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uniarchive
          POSTGRES_PASSWORD: uniarchive_ci_password
          POSTGRES_DB: uniarchive_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniarchive -d uniarchive_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Environnement virtuel
        run: |
          python -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install -r requirements-dev.txt

      # Par défaut la suite tourne sur SQLite (base en mémoire, ~40 s) :
      # c'est le même périmètre que `venv/bin/python -m pytest` en local.
      - name: Suite complète (SQLite)
        run: venv/bin/python -m pytest

      # Même suite sur le dialecte de production : les requêtes spécifiques à
      # un dialecte (sqlite_master…) ressortent ici, pas à la livraison.
      - name: Suite complète (PostgreSQL 16)
        env:
          TEST_DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@127.0.0.1:5432/${{ env.POSTGRES_DB }}
        run: venv/bin/python -m pytest

      - name: Store de sessions Redis 7
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
        run: venv/bin/python -m pytest tests/test_session_redis.py

  # -------------------------------------------------------------------------
  # 4. Image Docker : build + démarrage réel (entrypoint complet)
  # -------------------------------------------------------------------------
  docker:
    name: Docker build & démarrage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uniarchive
          POSTGRES_PASSWORD: uniarchive_ci_password
          POSTGRES_DB: uniarchive_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uniarchive -d uniarchive_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: docker build
        run: docker build -t uniarchive-backend:ci .

      # `--network host` : le conteneur voit les services publiés sur la
      # machine hôte (127.0.0.1:5432 / :6379), comme en compose.
      - name: Démarrage (create_all → stamp Alembic → migrations → seeds)
        run: |
          docker run -d --name backend --network host \
            -e FLASK_ENV=production \
            -e SECRET_KEY="cle-de-ci-suffisamment-longue-0123456789abcdef" \
            -e DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}" \
            -e REDIS_URL="redis://127.0.0.1:6379/0" \
            -e SESSION_COOKIE_SECURE=false \
            -e FORCE_HTTPS=false \
            uniarchive-backend:ci

      - name: "/health → 200 + enveloppe d'erreur sur /api inconnue"
        run: |
          code=000
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/health || true)
            if [ "$code" = "200" ]; then break; fi
            echo "attente /health (${attempt}/60) → ${code}"
            sleep 3
          done
          echo "/health = ${code}"
          test "${code}" = "200"

          # Contrat d'erreur (P0.4) vérifié sur l'image livrée, pas seulement
          # dans la suite de tests.
          body=$(curl -s http://127.0.0.1:5000/api/route-inexistante)
          echo "${body}"
          echo "${body}" | grep -q '"error"'

      - name: Journaux du conteneur
        if: always()
        run: docker logs backend
